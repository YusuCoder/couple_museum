# AWS Amplify Hosting build (static Vite site).
# Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under
# App settings → Environment variables; Vite bakes them in at build time.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
